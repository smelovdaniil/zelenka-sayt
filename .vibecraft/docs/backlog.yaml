phases:
  - id: mvp
    name: MVP
    description: Минимально жизнеспособный продукт
    order: 1
tasks:
  - id: task-001
    phase: mvp
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу лендинга со статическими данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения.
    priority: high
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - Данные отображаются из статических заглушек
    depends_on: []
    related_feature: Витрина популярных растений
    status: completed
    summary: >-
      Создана главная страница лендинга со статическими данными-заглушками.
      Разделы: Hero, Преимущества (5 карточек), Популярные растения (6 карточек),
      О компании, FAQ (5 вопросов), Контакты. AppName обновлён на «Зелёнка»,
      цветовая схема переведена в зелёную гамму бренда. Все данные — из lib/data.ts.
      typecheck, lint, build — без ошибок.
  - id: task-002
    phase: mvp
    title: Хэдер с логотипом, меню и телефоном
    description: "Липкий фиксированный хэдер: логотип «🌱 Зелёнка» слева, меню
      (Каталог, Доставка, О нас, Контакты), справа кнопка-телефон +7 (812)
      555-XX-XX. На телефоне — бургер-меню на чистом JS."
    priority: high
    acceptance_criteria:
      - Хэдер фиксирован сверху и не исчезает при скролле
      - Меню содержит 4 пункта
      - Телефон отображается справа
      - На телефоне меню сворачивается в бургер
    depends_on:
      - task-001
    related_feature: Витрина популярных растений
    status: completed
    summary: >-
      Создан клиентский компонент Header (components/header.tsx) с sticky
      позиционированием, логотипом «Зелёнка» слева, меню из 4 пунктов (Каталог,
      Доставка, О нас, Контакты) и телефоном +7 (812) 555-XX-XX справа. На
      мобильных устройствах меню сворачивается в бургер с переключением через
      React-состояние. Header подключён в app/layout.tsx вместо старого
      placeholder-хэдера. typecheck, lint, build — без ошибок.
  - id: task-003
    phase: mvp
    title: Блок Героя с таймером и кнопкой
    description:
      Блок на всю высоту экрана (100vh) с градиентным фоном, заголовком
      про доставку за 24 часа, выделенной фразой «Бесплатная доставка от 10 000
      ₽» зелёным, кнопкой «Выбрать растения» с якорем на витрину и таймером
      обратного отсчёта до 1 августа 2026.
    priority: high
    acceptance_criteria:
      - Блок занимает 100vh
      - "Фраза о бесплатной доставке выделена #4CAF50"
      - Таймер отображает Дни:Часы:Минуты до 01.08.2026
      - Кнопка скроллит к витрине
    depends_on:
      - task-002
    related_feature: Сезонная акция с таймером
    status: completed
    summary: >-
      Реализован блок героя на 100vh с градиентным фоном, заголовком «Доставка
      растений за 24 часа», фразой «Бесплатная доставка от 10 000 ₽» в цвете
      #4CAF50, таймером обратного отсчёта до 01.08.2026 (Дни:Часы:Минуты) и
      кнопкой «Выбрать растения», которая плавно скроллит к витрине. Таймер —
      клиентский компонент components/hero-timer.tsx, якорь id="showcase" на
      секции популярных растений. typecheck, lint, build — без ошибок.
  - id: task-004
    phase: mvp
    title: Блок 5 преимуществ
    description: "Сетка из 5 колонок на ПК с иконками и текстами: гарантия
      приживаемости, бесплатная доставка, консультация агронома, 24 часа от
      выкопки до отправки, скидка 10% на второй заказ."
    priority: medium
    acceptance_criteria:
      - Отображается 5 преимуществ с иконками
      - На ПК — 5 колонок в ряд
      - На телефоне — вертикальный список
    depends_on:
      - task-003
    related_feature: Витрина популярных растений
    status: completed
    summary: >-
      Блок 5 преимуществ реализован в app/page.tsx:55-82 с данными из
      lib/data.ts:19-45. Сетка grid-cols-1 sm:grid-cols-2 lg:grid-cols-5
      обеспечивает 5 колонок на ПК и вертикальный список на телефоне. Каждая
      карточка содержит иконку (lucide-react), заголовок и описание. typecheck,
      lint, build — без ошибок.
  - id: task-005
    phase: mvp
    title: Витрина популярных растений с карточками
    description: "Сетка 3×2 карточек товаров (Туя Смарагд, Гортензия, Пион
      древовидный, Можжевельник, Клен остролистный, Роза плетистая). У каждой:
      фото-заглушка, название, цена, кнопка «Заказать». Под сеткой — кнопка
      «Смотреть полный каталог»."
    priority: high
    acceptance_criteria:
      - Отображается ровно 6 карточек
      - У каждой карточки есть фото-заглушка, название, цена, кнопка «Заказать»
      - Есть кнопка «Смотреть полный каталог»
      - На телефоне 1 колонка, на планшете 2, на ПК 3
    depends_on:
      - task-004
    related_feature: Витрина популярных растений
    status: completed
    summary: >-
      Витрина уже была реализована в app/page.tsx:84-134 с данными из
      lib/data.ts:55-98. Сетка grid-cols-1 sm:grid-cols-2 lg:grid-cols-3
      обеспечивает 1 колонку на телефоне, 2 на планшете, 3 на ПК. Каждая
      из 6 карточек содержит фото-заглушку, название, цену и кнопку «Заказать».
      Под сеткой — кнопка «Смотреть полный каталог». typecheck, lint, build —
      без ошибок.
  - id: task-006
    phase: mvp
    title: Модальное окно с формой заказа и отправкой
    description: По клику «Заказать» открывается модальное окно с формой (Имя,
      Телефон, Комментарий). Название товара подставляется в комментарий.
      Отправка через FormSubmit.co без перезагрузки (fetch). После отправки —
      уведомление об успехе. Скрытые поля _captcha=false и _subject.
    priority: high
    acceptance_criteria:
      - Форма открывается по клику на «Заказать»
      - Комментарий предзаполнен названием товара
      - Отправка без перезагрузки страницы
      - После отправки показывается уведомление
      - Есть скрытые поля _captcha и _subject
    depends_on:
      - task-005
    related_feature: Система отправки заявок
    status: completed
    summary: >-
      Реализовано модальное окно с формой заказа на базе shadcn Dialog и
      компонента OrderButton (components/order-button.tsx). При клике «Заказать»
      открывается диалог с полями Имя, Телефон, Комментарий (предзаполнен
      названием товара). Отправка через FormSubmit.co (fetch, без перезагрузки),
      скрытые поля _captcha=false и _subject. После успешной отправки —
      уведомление sonner. typecheck, lint, build — без ошибок.
  - id: task-007
    phase: mvp
    title: Блок «О компании»
    description: "Две колонки: слева текст с упоминанием «15 лет выращиваем для
      вас», справа — серая заглушка под фото с пунктирной рамкой."
    priority: medium
    acceptance_criteria:
      - Текст содержит «15 лет выращиваем для вас»
      - Справа блок-заглушка с надписью «Сюда вставлю фото (800x600)»
    depends_on:
      - task-006
    related_feature: Информация о компании
    status: completed
    summary: >-
      Блок «О компании» реализован в app/page.tsx:135-156 с данными из
      lib/data.ts:100-108. Левая колонка содержит 3 абзаца текста, первый из
      которых начинается с «15 лет выращиваем для вас». Правая колонка —
      серая заглушка с пунктирной рамкой и надписью «Сюда вставлю фото
      (800x600)». typecheck, lint, build — без ошибок.
  - id: task-008
    phase: mvp
    title: FAQ-аккордеон
    description:
      5 вопросов про состав почвы, полив, возврат, высадку, гарантию. При
      клике ответ плавно раскрывается/закрывается (slideToggle на чистом JS).
    priority: medium
    acceptance_criteria:
      - Отображается 5 вопросов
      - При клике ответ плавно раскрывается
      - Анимация плавная
    depends_on:
      - task-007
    related_feature: FAQ (Аккордеон)
    status: completed
    summary: >-
      Создан клиентский компонент components/faq-accordion.tsx с 5 вопросами
      из lib/data.ts. Анимация slideToggle реализована через requestAnimationFrame
      и CSS transition: height 300ms ease-in-out — при клике высота контента плавно
      раскрывается/закрывается. Компонент подключён в app/page.tsx на месте
      нативного <details>. typecheck, lint, build — без ошибок.
  - id: task-009
    phase: mvp
    title: Блок контактов с картой и футер
    description:
      iframe Яндекс.Карты (Приозерск, Ленинградское шоссе, 31А). Рядом
      адрес, график 10:00–19:00, кнопка «Позвонить сейчас». Футер с копирайтом и
      ссылками на соцсети.
    priority: medium
    acceptance_criteria:
      - Отображается iframe Яндекс.Карт
      - Указан адрес и график работы
      - Кнопка «Позвонить сейчас» работает
      - Футер содержит копирайт и ссылки на соцсети
    depends_on:
      - task-008
    related_feature: Контакты и карта
    status: completed
    summary: >-
      Реализованы блок контактов с iframe Яндекс.Карт (Приозерск,
      Ленинградское шоссе, 31А), адресом, графиком 10:00–19:00 и кнопкой
      «Позвонить сейчас» (href="tel:") — в app/page.tsx. Создан компонент футера
      components/footer.tsx с копирайтом, контактами и ссылками на соцсети (VK,
      Telegram, WhatsApp). Footer подключён в app/layout.tsx. Данные соцсетей и
      phoneHref добавлены в lib/data.ts. typecheck, lint, build — без ошибок.
  - id: task-010
    phase: mvp
    title: Анимации появления при скролле
    description: >-
      Добавить Intersection Observer для плавного появления блоков при
      скролле. Плавный скролл к витрине по кнопке в герое.
    priority: medium
    acceptance_criteria:
      - Блоки плавно появляются при скролле
      - Кнопка в герое плавно скроллит к витрине
    depends_on:
      - task-009
    related_feature: Витрина популярных растений
    status: completed
    summary: >-
      Создан клиентский компонент ScrollReveal (components/scroll-reveal.tsx) на
      IntersectionObserver с threshold 0.1: при входе секции в видимость
      добавляются классы opacity-100 translate-y-0 (было opacity-0 translate-y-4),
      переход transition-all duration-700 ease-out. 5 секций (преимущества,
      витрина, о компании, FAQ, контакты) обёрнуты в ScrollReveal в
      app/page.tsx. Плавный скролл к #showcase уже был реализован в
      components/hero-timer.tsx через scrollIntoView({ behavior: 'smooth' }).
      typecheck, lint, build — без ошибок.
